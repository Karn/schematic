<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f3" />
    <title>Schematic — System diagram editor</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./diagram-style.css" />
    <link rel="stylesheet" href="./ui-style.css" />
    <link rel="stylesheet" href="./floating-ui.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1 class="brand">SCHEMATIC</h1>
        <div class="top-actions">
          <button id="new-diagram" class="button text-button" type="button">New</button>
          <button id="load-sample" class="button text-button" type="button">Sample</button>
          <button id="export-svg" class="button primary-button" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v9m0 0 3.5-3.5M10 11.5 6.5 8M3.5 13.5v3h13v-3"/></svg>
            Export SVG
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="canvas-area" aria-label="Diagram canvas">
          <div class="canvas-viewport" id="canvas-viewport">
            <span id="layout-status" class="visually-hidden" role="status">Auto layout on</span>
            <span id="connection-status" class="visually-hidden" role="status">Ready to connect</span>
            <svg id="diagram" class="diagram" role="img" aria-label="Editable system diagram" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L6 3.5 L1 6 Z" fill="#000"/></marker>
                <marker id="open-arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#000" stroke-width="1"/></marker>
                <marker id="arrowhead-knockout" markerWidth="29" markerHeight="29" viewBox="-10 -10 29 29" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L6 3.5 L1 6 Z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/></marker>
                <marker id="open-arrowhead-knockout" markerWidth="30" markerHeight="30" viewBox="-10 -10 30 30" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#fff" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/></marker>
                <pattern id="halftone" patternUnits="userSpaceOnUse" width="6" height="6"><circle cx="1" cy="1" r="0.55" fill="#000"/><circle cx="4" cy="1" r="0.55" fill="#000"/><circle cx="2.5" cy="4" r="0.55" fill="#000"/><circle cx="5.5" cy="4" r="0.55" fill="#000"/></pattern>
                <pattern id="canvas-tile" patternUnits="userSpaceOnUse" width="32" height="32"><path d="M32 0H0V32" fill="none" stroke="#e7e7e7" stroke-width="0.7"/></pattern>
              </defs>
              <defs id="shape-masks"></defs>
              <rect id="canvas-tiles" fill="url(#canvas-tile)"></rect>
              <g id="shadows-layer"></g>
              <g id="backings-layer"></g>
              <g id="edge-knockouts-layer"></g>
              <g id="edges-layer"></g>
              <g id="nodes-layer"></g>
            </svg>
            <textarea id="inline-editor" class="inline-editor" aria-label="Edit node text" spellcheck="false" hidden></textarea>
            <div id="empty-state" class="empty-state" hidden><h2>Double click to add text</h2></div>
            <div class="canvas-hint" id="canvas-hint" hidden>Release on another block · Esc to cancel</div>
            <div class="canvas-controls" role="group" aria-label="Canvas zoom">
              <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
              <button id="zoom-fit" type="button" aria-label="Fit diagram">Fit</button>
              <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
            </div>
          </div>
        </section>

        <aside class="inspector" aria-label="Selection properties">
          <div class="inspector-header"><span class="section-heading">EDIT</span><button id="close-inspector" class="icon-button" type="button" aria-label="Deselect" hidden>×</button></div>
          <div id="inspector-empty" class="inspector-empty"><strong>Select a block</strong></div>
          <div id="inspector-content" hidden>
            <div class="inspector-section">
              <div class="inspector-label">APPEARANCE</div>
              <span class="field-label">Entity shape</span>
              <div class="segmented border-style-options" role="group" aria-label="Entity shape">
                <button type="button" data-border-style="text">None</button>
                <button type="button" data-border-style="box">Single</button>
                <button type="button" data-border-style="double">Double</button>
                <button type="button" data-border-style="database">Database</button>
              </div>
              <label id="shadow-control" class="toggle-row" for="node-shadow-toggle"><span><strong>Dot shadow</strong></span><input type="checkbox" id="node-shadow-toggle" role="switch" /><span class="switch"></span></label>
            </div>
            <div class="inspector-bottom"><button id="delete-node" class="button danger-button" type="button">Delete block</button></div>
          </div>
          <div id="edge-inspector" hidden><div class="inspector-section"><div class="inspector-label">CONNECTION</div><p class="edge-description" id="edge-description"></p><button id="delete-edge" class="button danger-button" type="button">Delete connection</button></div></div>
        </aside>
      </main>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
